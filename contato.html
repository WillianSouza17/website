<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - GameCore</title>
    <link rel="stylesheet" href="bootstrap/bootstrap-5.0.2-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="script.js"></script>
</head>
<body>

    <header></header>

    <main class="container my-5">
        <section class="text-center mb-5">
            <h1 class="display-4 text-white">Fale Conosco</h1>
            <p class="fs-5 text-muted">Tem alguma dúvida, sugestão ou precisa de ajuda com seu pedido?</p>
            <hr class="w-25 mx-auto border-primary">
        </section>

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="p-4 p-md-5 rounded shadow" style="background-color: #1f1038;">
                    <form action="#" method="post">
                        <div class="mb-3">
                            <label for="nome" class="form-label text-white">Nome Completo:</label>
                            <input type="text" class="form-control" id="nome" name="nome" required placeholder="Digite seu nome completo">
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label text-white">E-mail:</label>
                            <input type="email" class="form-control" id="email" name="email" required placeholder="seuemail@exemplo.com">
                        </div>

                        <div class="mb-3">
                            <label for="assunto" class="form-label text-white">Assunto:</label>
                            <select class="form-select" id="assunto" name="assunto">
                                <option value="duvida">Dúvida sobre produtos</option>
                                <option value="suporte">Suporte técnico</option>
                                <option value="reclamacao">Reclamação ou Troca</option>
                                <option value="outro">Outro assunto</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="mensagem" class="form-label text-white">Mensagem:</label>
                            <textarea class="form-control" id="mensagem" name="mensagem" rows="5" required placeholder="Escreva sua mensagem aqui..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold text-uppercase">Enviar Mensagem</button>
                    </form>
                </div>
            </div>
        </div>

        <section class="text-center mt-5">
            <div class="row justify-content-center g-4">
                <div class="col-md-4">
                    <div class="p-4 rounded" style="background-color: #2d1b4e;">
                        <p class="fs-5 fw-bold text-white mb-2">Telefone / SAC</p>
                        <p class="mb-0">(XX) XXXXX-XXXX</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="p-4 rounded" style="background-color: #2d1b4e;">
                        <p class="fs-5 fw-bold text-white mb-2">E-mail</p>
                        <p class="mb-0">contato@gamecore.com.br</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="p-4 rounded" style="background-color: #2d1b4e;">
                        <p class="fs-5 fw-bold text-white mb-2">Horário</p>
                        <p class="mb-0">Seg a Sex, 08h às 18h</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer></footer>

</body>
</html>
